name: Update Event Schedules

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update_schedules.py'
      - '.github/workflows/update-schedules.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update schedules
        run: python update_schedules.py

      - name: Publish changes
        run: |
          git config user.name "Schedule Updater"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update event schedules"
          git push
